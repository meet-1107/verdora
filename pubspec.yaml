name: b2b_saas
description: B2B Inventory, Order Management, Billing & Admin System (Flutter + Firebase).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.2
  cloud_functions: ^5.0.1

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  data_table_2: ^2.5.15

  # Import / Export engine
  csv: ^6.0.0
  excel: ^4.0.3
  file_picker: ^8.0.5
  archive: ^3.6.1

  # Images
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # PDF invoices
  pdf: ^3.11.0
  printing: ^5.13.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  collection: ^1.18.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
