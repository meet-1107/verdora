include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    avoid_print: true
    # require_trailing_commas is intentionally disabled: it conflicts with the
    # Dart 3.12+ formatter (`dart format` no longer adds the commas it wants).
